    <!-- Single JavaScript to control ALL videos and Sky Icons -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. Handle Play/Pause Overlays ---
            const overlays = document.querySelectorAll('.video-overlay');

            overlays.forEach(overlay => {
                const card = overlay.closest('.gallery-card');
                const video = card.querySelector('video');
                const playIcon = overlay.querySelector('.play-icon');
                const pauseIcon = overlay.querySelector('.pause-icon');

                function togglePlay() {
                    if (video.paused) {
                        video.play();
                        playIcon.classList.add('hidden');
                        pauseIcon.classList.remove('hidden');
                        overlay.classList.remove('bg-black/30');
                        overlay.classList.add('bg-black/0');
                    } else {
                        video.pause();
                        playIcon.classList.remove('hidden');
                        pauseIcon.classList.add('hidden');
                        overlay.classList.remove('bg-black/0');
                        overlay.classList.add('bg-black/30');
                    }
                }

                overlay.addEventListener('click', togglePlay);

                overlay.addEventListener('mouseenter', () => {
                    if (!video.paused) {
                        overlay.classList.remove('bg-black/0');
                        overlay.classList.add('bg-black/30');
                    }
                });

                overlay.addEventListener('mouseleave', () => {
                    if (!video.paused) {
                        overlay.classList.remove('bg-black/30');
                        overlay.classList.add('bg-black/0');
                    }
                });
            });

            // --- 2. Handle Fullscreen Buttons ---
            const fullscreenButtons = document.querySelectorAll('.fullscreen-btn');

            fullscreenButtons.forEach(button => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation(); 
                    
                    const card = button.closest('.gallery-card');
                    const video = card.querySelector('video');

                    if (video.requestFullscreen) {
                        video.requestFullscreen();
                    } else if (video.webkitRequestFullscreen) { 
                        video.webkitRequestFullscreen();
                    } else if (video.msRequestFullscreen) { 
                        video.msRequestFullscreen();
                    }
                });
            });

            // --- 3. Interactive Flying Sky Icons ---
            const skyHeader = document.getElementById('sky-header');

            // The image you want to fly in the sky.
            const iconSVG = `<img src="src/design.png" class="w-full h-full object-contain drop-shadow-md" />`;

            function spawnIcon() {
                const icon = document.createElement('div');
                icon.classList.add('flying-icon');
                icon.innerHTML = iconSVG;

                const randomTop = Math.random() * 60;
                icon.style.top = randomTop + '%';

                const duration = Math.random() * 7 + 8;
                icon.style.animationDuration = `${duration}s, 2s`;

                const scale = Math.random() * 0.5 + 0.7;
                icon.style.transform = `scale(${scale})`;

                icon.addEventListener('click', () => {
                    icon.style.transform = `scale(${scale * 1.5})`;
                    icon.style.opacity = '0';
                    
                    setTimeout(() => {
                        icon.remove();
                    }, 300);
                });

                icon.addEventListener('animationend', (e) => {
                    if (e.animationName === 'flyAcross') {
                        icon.remove();
                    }
                });

                skyHeader.appendChild(icon);
            }

            setInterval(spawnIcon, 2500);
            spawnIcon();
            setTimeout(spawnIcon, 1200);
        });
    </script>
